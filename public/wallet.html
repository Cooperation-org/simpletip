<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Wallet — SimpleTip</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f5f5; color: #1a1a2e; }
  .page { max-width: 540px; margin: 0 auto; padding: 24px 16px; }
  h1 { font-size: 1.3rem; color: #3f2534; margin-bottom: 4px; }
  .sub { color: #888; font-size: 0.85rem; margin-bottom: 20px; }

  .no-wallet { text-align: center; padding: 40px 20px; }
  .no-wallet h2 { font-size: 1.1rem; color: #3f2534; margin-bottom: 8px; }
  .no-wallet p { font-size: 0.88rem; color: #888; margin-bottom: 16px; }
  .no-wallet .btn { display: inline-block; background: #00b2e5; color: #fff; padding: 10px 24px; border-radius: 8px; text-decoration: none; font-weight: 600; font-size: 0.9rem; }
  .no-wallet .btn:hover { background: #0090c0; }

  .overview { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; margin-bottom: 20px; }
  .stat { background: #fff; border-radius: 10px; padding: 16px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); text-align: center; }
  .stat-value { font-size: 1.5rem; font-weight: 700; color: #3f2534; }
  .stat-value.balance { color: #16a34a; }
  .stat-value.given { color: #00b2e5; }
  .stat-label { font-size: 0.72rem; color: #999; margin-top: 2px; }

  .actions { display: flex; gap: 8px; margin-bottom: 20px; }
  .actions button, .actions a {
    flex: 1; text-align: center; padding: 10px; border-radius: 8px; font-size: 0.85rem;
    font-weight: 600; cursor: pointer; text-decoration: none; border: none;
  }
  .btn-fund { background: #16a34a; color: #fff; }
  .btn-fund:hover { background: #15803d; }
  .btn-contact { background: #fff; color: #3f2534; border: 1px solid #d1d5db !important; }
  .btn-contact:hover { background: #f9fafb; }

  .section { background: #fff; border-radius: 10px; padding: 16px; margin-bottom: 16px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
  .section h2 { font-size: 0.95rem; color: #3f2534; margin-bottom: 10px; }

  .tx-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid #f3f4f6; font-size: 0.85rem; }
  .tx-row:last-child { border-bottom: none; }
  .tx-amount { font-weight: 600; }
  .tx-amount.positive { color: #16a34a; }
  .tx-amount.negative { color: #3f2534; }
  .tx-desc { color: #666; font-size: 0.82rem; }
  .tx-date { font-size: 0.68rem; color: #999; }
  .tx-balance { font-size: 0.68rem; color: #aaa; }

  .tip-row { padding: 8px 0; border-bottom: 1px solid #f3f4f6; font-size: 0.85rem; }
  .tip-row:last-child { border-bottom: none; }
  .tip-top { display: flex; justify-content: space-between; align-items: center; }
  .tip-amount { font-weight: 600; color: #3f2534; }
  .tip-to { color: #666; }
  .tip-date { font-size: 0.68rem; color: #999; }
  .tip-comment { font-size: 0.78rem; color: #555; font-style: italic; margin-top: 2px; }
  .tip-url { font-size: 0.65rem; color: #bbb; margin-top: 1px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .empty { text-align: center; padding: 16px; color: #999; font-size: 0.85rem; }

  .contact-info { font-size: 0.82rem; color: #666; margin-bottom: 16px; padding: 10px 14px; background: #f9fafb; border-radius: 8px; }
  .contact-info span { color: #3f2534; font-weight: 500; }

</style>
</head>
<body>
<script src="nav.js"></script>
<div class="page">
  <h1>My Wallet</h1>
  <p class="sub">Your SimpleTip balance and tip history.</p>

  <div id="noWallet" class="no-wallet" style="display:none;">
    <h2>No wallet found</h2>
    <p>Your wallet is created automatically when you tip on any page with SimpleTip.</p>
    <a class="btn" href="index.html">Try the demo</a>
  </div>

  <div id="walletView" style="display:none;">
    <div id="contactInfo" class="contact-info" style="display:none;"></div>

    <div class="overview">
      <div class="stat">
        <div class="stat-value balance" id="balance">$0.00</div>
        <div class="stat-label">Balance</div>
      </div>
      <div class="stat">
        <div class="stat-value given" id="totalGiven">$0.00</div>
        <div class="stat-label">Total given</div>
      </div>
      <div class="stat">
        <div class="stat-value" id="totalFunded">$0.00</div>
        <div class="stat-label">Total funded</div>
      </div>
    </div>

    <div class="actions">
      <button class="btn-fund" id="fundBtn">Add funds</button>
      <button class="btn-contact" id="contactBtn">Link email</button>
    </div>

    <div class="section">
      <h2>Recent Tips</h2>
      <div id="tipsList"></div>
    </div>

    <div class="section">
      <h2>Transaction History</h2>
      <div id="txList"></div>
    </div>
  </div>

</div>

<script>
  const API = '/simpletip/api';

  function cents(v) { return '$' + (Math.abs(v) / 100).toFixed(2); }

  function escHtml(s) {
    const d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  let wallet = null;
  try {
    const raw = localStorage.getItem('simpletip_wallet');
    if (raw) wallet = JSON.parse(raw);
  } catch (e) {}

  if (!wallet || !wallet.token) {
    document.getElementById('noWallet').style.display = '';
  } else {
    document.getElementById('walletView').style.display = '';
    loadWallet();
  }

  async function loadWallet() {
    const headers = { 'Authorization': `Bearer ${wallet.token}` };

    // Fetch wallet info + tips + history in parallel
    const [info, tips, history] = await Promise.all([
      fetch(`${API}/wallet`, { headers }).then(r => r.json()),
      fetch(`${API}/wallet/tips`, { headers }).then(r => r.json()),
      fetch(`${API}/wallet/history`, { headers }).then(r => r.json()),
    ]);

    // Overview
    document.getElementById('balance').textContent = cents(info.balance || 0);
    document.getElementById('totalGiven').textContent = cents(info.totalTipped || 0);
    document.getElementById('totalFunded').textContent = cents(info.totalFunded || 0);

    // Contact info
    const contactDiv = document.getElementById('contactInfo');
    const parts = [];
    if (info.name) parts.push(`<span>${escHtml(info.name)}</span>`);
    if (info.email) parts.push(escHtml(info.email));
    if (info.handle) parts.push(escHtml(info.handle));
    if (parts.length) {
      contactDiv.innerHTML = parts.join(' · ');
      contactDiv.style.display = '';
    }

    // Update contact button label
    if (info.email) {
      document.getElementById('contactBtn').textContent = 'Update info';
    }

    // Tips
    const tipsList = document.getElementById('tipsList');
    if (tips && tips.length > 0) {
      tipsList.innerHTML = tips.map(t => {
        const rcvrs = Array.isArray(t.receivers) ? t.receivers : (typeof t.receivers === 'string' ? JSON.parse(t.receivers) : []);
        const names = rcvrs.map(r => r.name || r.slug).join(' + ');
        return `
          <div class="tip-row">
            <div class="tip-top">
              <span>
                <span class="tip-amount">${cents(t.amount_cents)}</span>
                <span class="tip-to">to ${escHtml(names || 'unknown')}</span>
              </span>
              <span class="tip-date">${new Date(t.created_at).toLocaleDateString()}</span>
            </div>
            ${t.comment ? `<div class="tip-comment">"${escHtml(t.comment)}"</div>` : ''}
            ${t.page_url ? `<div class="tip-url">${escHtml(t.page_url)}</div>` : ''}
          </div>
        `;
      }).join('');
    } else {
      tipsList.innerHTML = '<div class="empty">No tips yet. Find an article with SimpleTip and tip the author!</div>';
    }

    // Transaction history
    const txList = document.getElementById('txList');
    if (history && history.length > 0) {
      txList.innerHTML = history.map(tx => {
        const isPositive = tx.amount_cents > 0;
        return `
          <div class="tx-row">
            <div>
              <div class="tx-desc">${escHtml(tx.description || tx.type)}</div>
              <div class="tx-date">${new Date(tx.created_at).toLocaleDateString()}</div>
            </div>
            <div style="text-align:right;">
              <div class="tx-amount ${isPositive ? 'positive' : 'negative'}">${isPositive ? '+' : '-'}${cents(tx.amount_cents)}</div>
              <div class="tx-balance">bal ${cents(tx.balance_after_cents)}</div>
            </div>
          </div>
        `;
      }).join('');
    } else {
      txList.innerHTML = '<div class="empty">No transactions yet.</div>';
    }
  }

  // Fund button
  document.getElementById('fundBtn').addEventListener('click', () => {
    window.open('fund.html', 'simpletip-fund', 'width=420,height=550,scrollbars=yes');
  });

  // Contact button — simple inline prompt
  document.getElementById('contactBtn').addEventListener('click', async () => {
    const email = prompt('Enter your email to protect your wallet:');
    if (!email) return;

    const resp = await fetch(`${API}/wallet/contact`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${wallet.token}` },
      body: JSON.stringify({ email }),
    }).then(r => r.json());

    if (resp.success) {
      wallet.email = email;
      localStorage.setItem('simpletip_wallet', JSON.stringify(wallet));
      location.reload();
    }
  });

  // Listen for fund updates
  window.addEventListener('message', (event) => {
    if (event.data && event.data.type === 'simpletip-wallet-updated') {
      wallet = event.data.wallet;
      localStorage.setItem('simpletip_wallet', JSON.stringify(wallet));
      loadWallet();
    }
  });
</script>
</body>
</html>
